name: traces

# Visits real sites from a GitHub-hosted runner and saves the size and
# direction of the first records of each connection. The traces are the
# comparison traffic for the detectors in internal/measure and the source of
# the shaper's opening profiles. Nothing but sizes and directions is kept.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Collect
        env:
          REALITY_PT_TRACE_OUT: ${{ runner.temp }}/real-traces.json
        run: go test ./internal/measure/lab -run '^TestCollectRealTraces$' -count=1 -v -timeout 25m
      - uses: actions/upload-artifact@v4
        with:
          name: real-traces
          path: ${{ runner.temp }}/real-traces.json
