name: censor

# Replays recorded traffic through censor emulators built on CensorLab. The
# emulators are stand-ins written for this project, not real censors. CensorLab
# is GPL-3.0 and is only used here as a tool: nothing of it is copied or shipped.
on:
  pull_request:
    paths:
      - "test/censor/**"
      - "internal/measure/**"
      - "transport/**"
      - "shaper/**"
      - ".github/workflows/censor.yml"
  push:
    branches: [main]
    paths:
      - "test/censor/**"
      - "internal/measure/**"
      - "transport/**"
      - "shaper/**"
      - ".github/workflows/censor.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CENSORLAB_REF: 5a6c8b448a7392431f93cc3ed99b67ccdca9f986

jobs:
  censor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Build tools
        run: sudo apt-get update && sudo apt-get install -y tcpdump libnetfilter-queue-dev libmnl-dev pkg-config clang
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            censorlab/target
          key: censorlab-${{ env.CENSORLAB_REF }}
      - name: Get CensorLab
        run: |
          # The cache may have created censorlab/target already, so fetch into the
          # directory instead of cloning.
          mkdir -p censorlab
          git -C censorlab init -q
          git -C censorlab fetch -q --depth 1 https://github.com/SPIN-UMass/censorlab.git "$CENSORLAB_REF"
          git -C censorlab checkout -q FETCH_HEAD
      - name: Build CensorLab
        working-directory: censorlab
        run: cargo build --release
      - name: Record and replay
        env:
          CENSORLAB: ${{ github.workspace }}/censorlab/target/release/censorlab
          WORK: ${{ runner.temp }}/censor
        run: bash test/censor/run.sh
      - name: Keep captures and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: censor-run
          path: ${{ runner.temp }}/censor
          if-no-files-found: ignore
