name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - name: go test
        run: |
          race=""
          if [ "$RUNNER_OS" = "Linux" ]; then race="-race"; fi
          go test $race -count=1 ./...

      - name: Measurements
        if: runner.os == 'Linux'
        run: |
          go test ./transport/reality -run 'TestPostHandshakeRecordsMatchTheCover' -v -count=1
          go test ./internal/measure/lab -run 'TestShapingMovesWhatADetectorSees' -v -count=1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --skip=publish,sign --clean
      - name: Package contents
        run: |
          ls dist
          deb="$(ls dist/*_amd64.deb | head -1)"
          dpkg-deb -c "$deb" | grep -E 'usr/bin/reality-(client|server|keygen|check)$' | wc -l | grep -qx 4
          ls dist/*.sbom.json | head -3
