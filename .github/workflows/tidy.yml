name: tidy

# Manual job: runs gofmt and go mod tidy in CI and commits the result, so
# nobody needs a Go toolchain on their own machine. Pass modules in the "get"
# input, for example "github.com/refraction-networking/utls@master", to
# upgrade them first.
on:
  workflow_dispatch:
    inputs:
      get:
        description: Space-separated modules to pass to go get
        required: false
        default: ""

permissions:
  contents: write
  actions: write

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: go get
        if: inputs.get != ''
        run: go get ${{ inputs.get }}
      - run: gofmt -w .
      - run: go mod tidy
      - name: Commit changes and start CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Run gofmt and go mod tidy"
          git push
          # Pushes made with GITHUB_TOKEN do not start workflows, so start CI by hand.
          gh workflow run ci.yml --ref "${GITHUB_REF_NAME}"
