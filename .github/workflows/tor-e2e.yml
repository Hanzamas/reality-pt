name: tor-e2e

# Runs a real Tor bridge and a real Tor client through reality-pt on a GitHub
# runner. It needs the public Tor network, so it is kept apart from ci.
on:
  push:
    branches: [main]
    paths:
      - "transport/**"
      - "internal/**"
      - "cmd/**"
      - "scripts/tor-e2e.sh"
      - ".github/workflows/tor-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install Tor
        run: |
          sudo apt-get update
          sudo apt-get install -y tor
          sudo systemctl stop tor tor@default 2>/dev/null || true
          tor --version | head -1
      - name: Build binaries
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          for name in reality-client reality-server reality-keygen; do
            go build -trimpath -o "$RUNNER_TEMP/bin/$name" "./cmd/$name"
          done
      - name: Bridge and client through reality-pt
        env:
          BIN: ${{ runner.temp }}/bin
          WORK: ${{ runner.temp }}/tor-e2e
        run: bash scripts/tor-e2e.sh
      - name: Keep logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tor-logs
          path: |
            ${{ runner.temp }}/tor-e2e/*.log
            ${{ runner.temp }}/tor-e2e/*.stdout
          if-no-files-found: ignore
