version: 2

builds:
  - id: client
    main: ./cmd/reality-client
    binary: reality-client
    env: [CGO_ENABLED=0]
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/hanzamas/reality-pt/internal/version.Version={{.Version}}

  - id: server
    main: ./cmd/reality-server
    binary: reality-server
    env: [CGO_ENABLED=0]
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/hanzamas/reality-pt/internal/version.Version={{.Version}}

  - id: keygen
    main: ./cmd/reality-keygen
    binary: reality-keygen
    env: [CGO_ENABLED=0]
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - NOTICE.md
      - LICENSES/*
      - README.md

nfpms:
  - id: reality-pt
    package_name: reality-pt
    ids: [client, server, keygen]
    maintainer: Hanzamas <113221213+Hanzamas@users.noreply.github.com>
    homepage: https://github.com/Hanzamas/reality-pt
    license: BSD-3-Clause
    description: REALITY-style pluggable transport for Tor (client, bridge, key generator).
    formats: [deb, rpm, apk]
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/reality-pt/LICENSE
      - src: NOTICE.md
        dst: /usr/share/doc/reality-pt/NOTICE.md
      - src: LICENSES/MPL-2.0.txt
        dst: /usr/share/doc/reality-pt/MPL-2.0.txt

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
